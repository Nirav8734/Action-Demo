name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Select test tag"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression

      testFile:
        description: "Run specific test file (optional)"
        required: false
        default: ""

      testFolder:
        description: "Run specific folder (optional)"
        required: false
        default: ""

      browser:
        description: "Select browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      email:
        description: "Email to send report"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🧪 Run Playwright Tests
        run: |
          CMD="npx playwright test"

          # Apply browser
          CMD="$CMD --project=${{ github.event.inputs.browser }}"

          # Apply tag
          if [ "${{ github.event.inputs.tag }}" != "all" ]; then
            CMD="$CMD --grep @${{ github.event.inputs.tag }}"
          fi

          # Apply file
          if [ ! -z "${{ github.event.inputs.testFile }}" ]; then
            CMD="$CMD ${{ github.event.inputs.testFile }}"
          fi

          # Apply folder
          if [ ! -z "${{ github.event.inputs.testFolder }}" ]; then
            CMD="$CMD ${{ github.event.inputs.testFolder }}"
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: 📊 Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: 📧 Send Email with Report
        uses: dawidd6/action-send-mail@v3
        with:
            server_address: smtp.gmail.com
            server_port: 465
            secure: true
            username: ${{ secrets.EMAIL_USERNAME }}
            password: ${{ secrets.EMAIL_PASSWORD }}
            subject: "Playwright Test Report"
            to: niravprajapati1309@gmail.com
            from: "Playwright Bot ${{ secrets.EMAIL_USERNAME }}"
            body: |
              Hello,

              Please find attached the Playwright test report.

              Regards,
              Automation Team
            attachments: playwright-report/index.html